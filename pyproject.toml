[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "run-comfyui-workflow"
version = "0.1.0"
description = "Helpers to run ComfyUI workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "MieMieeeee" }
]
dependencies = [
  "requests>=2.0",
  "websockets>=10.0"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "run*"]
